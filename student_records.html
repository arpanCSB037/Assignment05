<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="student_records.css">
</head>

<body>
    <div class="container">
        <h1>Student Records</h1>

        <div class="form-card">
            <h2>Add Student Record</h2>

            <form id="studentForm">
                <label for="rollno">Roll No</label>
                <input type="text" id="rollno" name="rollno" placeholder="Enter roll number" required>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter student name" required>

                <label>Gender</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>

                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="EE">EE</option>
                    <option value="ME">ME</option>
                    <option value="CE">CE</option>
                </select>

                <label for="CGPA">CGPA</label>
                <input type="number" id="CGPA" name="CGPA" min="0" max="10" step="0.01" placeholder="Enter CGPA"
                    required>

                <input type="hidden" id="formAction" name="formAction" value="insert">

                <button type="submit" id="submitBtn">Add Student</button>
            </form>

            <div id="message"></div>
        </div>

        <div class="search-card">
            <label for="searchBox">Search Students</label>
            <input type="text" id="searchBox" placeholder="Search by roll no, name, gender or department..."
                autocomplete="off">
        </div>

        <button id="loadBtn">Load All Records</button>

        <div id="tableContainer" class="table-wrapper"></div>

        <div class="statistics-card">
            <h2>CGPA Statistics</h2>
            <button id="statisticsBtn">Calculate Statistics</button>
            <div id="statisticsResult"></div>
        </div>
    </div>

    <script src="student_records.js"></script>
</body>

</html>
